<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jax-js spike</title>
    <style>
      body {
        font:
          14px/1.4 system-ui,
          sans-serif;
        margin: 16px;
        color: #111;
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #eee;
          background: #181818;
        }
      }
      pre {
        white-space: pre-wrap;
      }
      button {
        margin-right: 8px;
      }
    </style>
  </head>
  <body>
    <h1>jax-js spike</h1>
    <p id="env"></p>

      <button data-part="train">train</button>

      <button data-part="bench">bench</button>

    <pre id="log"></pre>

</html>
